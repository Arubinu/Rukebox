# The container's sound: a virtual output of its own.
#
# Nothing is plugged into a container, so without this there is no audio node
# at all - and a stream has nothing to encode. `support.null-audio-sink` is
# PipeWire's own virtual sink: mpv plays to it (AUDIO_OUTPUT=jack finds it as
# the ALSA/default output) and its monitor is what src/stream.py encodes. It
# costs no CPU beyond the mixing already happening, and it is what makes
# "listen to the radio in a container" work with no hardware whatsoever.
#
# Installed to /etc/pipewire/pipewire.conf.d/ by the Dockerfile. A host
# PipeWire is never given this file: the container's own one is not started in
# that variant at all (see docker/supervisor.py).
context.properties = {
    default.clock.rate = 48000
}

context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = rukebox_output
            node.description = "Rukebox output"
            media.class      = Audio/Sink
            object.linger    = true
            audio.position   = [ FL FR ]
        }
    }
]
