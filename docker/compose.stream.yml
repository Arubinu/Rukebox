# Rukebox in a container - Variant 1: the network stream, and nothing else.
#
#   docker compose -f docker/compose.stream.yml up -d
#
# This is the one that always works: no sound card, no Bluetooth, no
# privileges. The radio still plays; you hear it with "Listen here" on the
# page, in VLC (open http://<host>:8080/stream.opus), or on a network speaker.
#
# A player on the same network can also find it by itself over UPnP - see
# Audio > Announce the stream. That needs the player and the container to share
# a network: this bridge is not one, so use network_mode: host (variant 4) or a
# macvlan network if you want VLC to list "Rukebox" without being told anything.
#
# Turn the stream on first: Settings > Audio > Network audio stream, or the
# /config/rukebox.yaml the container writes on its first start.
# Named here: without it the stack is called after the docker/ folder it sits in.
name: rukebox

services:
  rukebox:
    image: ghcr.io/arubinu/rukebox:latest
    container_name: rukebox
    restart: unless-stopped
    environment:
      # The schedules fire on local time, and a container is on UTC without
      # this: put your own zone here (the host's, on a machine that has one).
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "8080:80"
    volumes:
      - ./config:/config
      - ./data:/data
      - ${RUKEBOX_MUSIC:-./music}:/music:ro
