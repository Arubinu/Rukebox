# The radio's address. Empty: this router's way out, which is the radio behind its access point.
RADIO_URL=

# A board on the USB port: auto takes the first one found, or name it (/dev/ttyACM0). Empty: none.
SERIAL_DEVICE=auto

# A button on an Ethernet port: sys:eth1, or swconfig:switch0:2 for a port of a switch.
# "rukebox-button ports" and "rukebox-button watch" show which one it is. Empty: none.
# The port must be out of the network bridge: the plug sends every frame back to it.
LINK_PORT=

# down: the plug stays looped and the press opens it. up: the press closes it.
LINK_PRESS=down

# Seconds a press on the Ethernet port ignores the next changes of its link.
LINK_REARM_SEC=3
