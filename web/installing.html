<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Rukebox</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <script>
      (function () {
        try {
          var choice = localStorage.getItem("rukebox_theme_choice") || "system";
          document.documentElement.setAttribute("data-theme", choice);
        } catch (e) {  }
      })();
    </script>
    <link rel="stylesheet" href="/style.css">
    <style>
      .install-box { width: min(440px, 100%); }
      .install-progress {
        width: 100%; height: 8px; margin-top: 22px; border-radius: 999px;
        background: var(--surface-2); overflow: hidden;
      }
      .install-progress > i {
        display: block; height: 100%; width: 0; border-radius: inherit;
        background: var(--boot-color); transition: width 0.6s ease;
      }
      .install-step { margin: 14px 0 0; font-weight: 600; }
      .install-detail { margin: 6px 0 0; color: var(--text-muted); font-size: 14px; min-height: 1.4em; }
      .install-error { margin: 10px 0 0; color: var(--danger); font-weight: 600; }
      /* Two sentences, one per line: the translation holds the line break. */
      .install-keep-on { white-space: pre-line; }
      .install-log { margin-top: 18px; width: 100%; text-align: left; }
      .install-log summary { cursor: pointer; color: var(--text-muted); font-size: 14px; text-align: center; }
      .install-log pre {
        max-height: 220px; overflow: auto; margin: 8px 0 0; padding: 10px;
        border-radius: var(--radius); background: var(--surface-2);
        font-size: 11px; white-space: pre-wrap; word-break: break-word;
      }
      /* Above the full-screen overlay (style.css), or it cannot be tapped. */
      .install-lang { position: fixed; top: 12px; right: 12px; z-index: 10001; }
    </style>
  </head>
  <body>
    <button type="button" id="langToggleBtn" class="icon-toggle-btn lang-btn install-lang" data-icon="globe"
            data-i18n-title="lang.toggle" data-i18n-aria-label="lang.toggle" title="Change language" aria-label="Change language">EN</button>
    <div id="installOverlay" class="boot-overlay" data-state="loading" role="status" aria-live="polite">
      <div class="boot-box install-box">
        <div class="boot-mark">
          <img class="boot-logo" src="/logo.webp" alt="" width="104" height="104">
        </div>
        <div class="boot-name" data-i18n="install.title">Installing the Rukebox</div>
        <div class="boot-eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="boot-alert" data-icon="alert" aria-hidden="true"></div>
        <div class="install-progress" aria-hidden="true"><i id="installBar"></i></div>
        <p class="install-step" id="installStep"></p>
        <p class="install-detail" id="installDetail"></p>
        <p class="install-error" id="installError" hidden></p>
        <p class="hint install-keep-on" data-i18n="install.keep_on">Leave the Pi on: it restarts by itself at the end, and this page follows.</p>
        <details class="install-log">
          <summary data-i18n="install.log">Details</summary>
          <pre id="installLog"></pre>
        </details>
      </div>
    </div>
    <script src="/i18n.js"></script>
    <script>
      let last = null;
      let finishing = false;
      function paint() {
        if (!last) return;
        const overlay = document.getElementById("installOverlay");
        const step = Number(last.step) || 0;
        const total = Number(last.total) || 6;
        document.getElementById("installBar").style.width =
          Math.round((last.key === "install.done" ? 1 : Math.max(0, step - 1) / total) * 100) + "%";
        document.getElementById("installStep").textContent =
          t("install.step_n", { n: step, total }) + " · " + t(last.key, { name: last.detail || "" });
        document.getElementById("installDetail").textContent =
          last.key === "install.step_packages" && last.section ? last.section : "";
        const err = document.getElementById("installError");
        err.hidden = !last.error;
        err.textContent = last.error ? t("install.err_" + last.error) : "";
        overlay.dataset.state = last.error ? "error" : (/_wait|_usb|_ethernet/.test(last.key) ? "waiting" : "loading");
        document.getElementById("installLog").textContent = (last.log || []).join("\n");
      }
      async function poll() {
        try {
          const res = await fetch("/api/install/status", { cache: "no-store" });
          const body = await res.json();
          if (body && body.ok && body.data) {
            last = body.data;
            finishing = last.key === "install.done" || last.key === "install.step_finish";
            paint();
          } else if (finishing) {
            location.reload();
            return;
          }
        } catch (e) {
          if (finishing) {
            document.getElementById("installDetail").textContent = t("install.rebooting");
            document.getElementById("installOverlay").dataset.state = "waiting";
          }
        }
        setTimeout(poll, 2000);
      }
      window.LANG_CHANGE_LISTENERS.push(paint);
      poll();
    </script>
  </body>
</html>
